services:
  - type: web
    name: angwa-backend
    runtime: image
    repo: https://github.com/0ill/Angwa_it_Solutions
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: TURSO_URL
        sync: false
      - key: TURSO_TOKEN
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false