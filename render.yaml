services:
  - type: web
    name: angwa-backend
    runtime: image
    repo: https://github.com/YOUR_USERNAME/angwa-backend  # replace with your repo URL
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: TURSO_URL
        sync: false
      - key: TURSO_TOKEN
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false